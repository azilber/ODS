schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: dashboard
  name: Dashboard (Control Center)
  aliases: []
  container_name: ods-dashboard
  default_host: dashboard
  port: 3001
  external_port_env: DASHBOARD_PORT
  external_port_default: 3001
  health: /
  ui_path: /
  type: docker
  # Core base-stack service — runs on every backend including CPU. Using
  # [all] (not [amd, nvidia]) so the dashboard-api manifest loader registers it
  # on cpu/apple hosts; otherwise config.py skips it and features that require
  # it (e.g. Hermes) are permanently gated off. See config.py backend filter.
  gpu_backends: [all]
  category: core
  depends_on: [dashboard-api]
