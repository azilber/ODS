schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: open-webui
  name: Open WebUI (Chat)
  aliases: [webui, ui, web]
  container_name: ods-webui
  host_env: WEBUI_HOST
  default_host: open-webui
  port: 8080
  external_port_env: WEBUI_PORT
  external_port_default: 3000
  health: /health
  ui_path: /
  type: docker
  # Core base-stack service — runs on every backend including CPU. Using
  # [all] (not [amd, nvidia]) so the dashboard-api manifest loader registers it
  # on cpu/apple hosts; otherwise config.py skips it and features that require
  # it (e.g. Hermes) are permanently gated off. See config.py backend filter.
  gpu_backends: [all]
  category: core
  depends_on: [llama-server]
  llm:
    consumes: true
    route: gateway
    pinning: none
    min_context: 0
    probe:
      kind: chat
      path: /openai/v1/chat/completions
      auth: webui-session
